<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg1.1.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1" width="960" height="290" viewBox="0 0 960 290"
     content="&lt;mxfile host=&quot;app.diagrams.net&quot; type=&quot;device&quot;&gt;
  &lt;diagram name=&quot;Architecture&quot; id=&quot;architecture&quot;&gt;
    &lt;mxGraphModel dx=&quot;960&quot; dy=&quot;300&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;0&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;
      &lt;root&gt;
        &lt;mxCell id=&quot;0&quot;/&gt;
        &lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;
        &lt;mxCell id=&quot;grp&quot; value=&quot;cocoTEMU (cocotb)&quot; style=&quot;rounded=1;dashed=1;dashPattern=8 4;fillColor=none;strokeColor=#999999;fontStyle=3;verticalAlign=top;fontSize=13;spacingTop=4;container=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
          &lt;mxGeometry x=&quot;270&quot; y=&quot;30&quot; width=&quot;420&quot; height=&quot;240&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;qemu&quot; value=&quot;&amp;lt;b&amp;gt;QEMU&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;Zynq PS Firmware&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;fontSize=12;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
          &lt;mxGeometry x=&quot;10&quot; y=&quot;105&quot; width=&quot;155&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;bridge&quot; value=&quot;&amp;lt;b&amp;gt;QemuBridge&amp;lt;/b&amp;gt;&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
          &lt;mxGeometry x=&quot;300&quot; y=&quot;105&quot; width=&quot;140&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;axi&quot; value=&quot;&amp;lt;b&amp;gt;CocotemuAxiMaster&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;(cocotbext-axi)&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
          &lt;mxGeometry x=&quot;500&quot; y=&quot;105&quot; width=&quot;175&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;dut&quot; value=&quot;&amp;lt;b&amp;gt;Verilator&amp;lt;/b&amp;gt;&amp;lt;br/&amp;gt;PL RTL / DUT&quot; style=&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=12;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;
          &lt;mxGeometry x=&quot;790&quot; y=&quot;105&quot; width=&quot;160&quot; height=&quot;70&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;e1&quot; value=&quot;chardev Unix socket&amp;lt;br/&amp;gt;&amp;lt;i&amp;gt;mmio_stub_msg_hdr&amp;lt;/i&amp;gt; (18 B)&quot; style=&quot;fontSize=10;&quot; edge=&quot;1&quot; parent=&quot;1&quot; source=&quot;qemu&quot; target=&quot;bridge&quot;&gt;
          &lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;e2&quot; value=&quot;&quot; edge=&quot;1&quot; parent=&quot;1&quot; source=&quot;bridge&quot; target=&quot;axi&quot;&gt;
          &lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;e3&quot; value=&quot;AXI4-Lite&quot; style=&quot;fontSize=11;&quot; edge=&quot;1&quot; parent=&quot;1&quot; source=&quot;axi&quot; target=&quot;dut&quot;&gt;
          &lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
        &lt;mxCell id=&quot;e4&quot; value=&quot;response&quot; style=&quot;dashed=1;fontSize=10;&quot; edge=&quot;1&quot; parent=&quot;1&quot; source=&quot;dut&quot; target=&quot;qemu&quot;&gt;
          &lt;mxGeometry relative=&quot;1&quot; as=&quot;geometry&quot;/&gt;
        &lt;/mxCell&gt;
      &lt;/root&gt;
    &lt;/mxGraphModel&gt;
  &lt;/diagram&gt;
&lt;/mxfile&gt;">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="ah-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #333; }
      .box { stroke-width: 1.5; }
      .label-bold { font-weight: bold; font-size: 13px; }
      .label-sub { font-size: 11px; fill: #555; }
      .edge-label { font-size: 10px; fill: #555; }
    </style>
  </defs>

  <!-- cocoTEMU group (dashed boundary) -->
  <rect x="275" y="32" width="415" height="236" rx="10" ry="10"
        fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="482" y="55" text-anchor="middle" font-size="13" font-style="italic" font-weight="bold" fill="#888">cocoTEMU (cocotb)</text>

  <!-- QEMU box -->
  <rect x="10" y="105" width="155" height="70" rx="8" ry="8"
        class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="87" y="137" text-anchor="middle" class="label-bold">QEMU</text>
  <text x="87" y="155" text-anchor="middle" class="label-sub">Zynq PS Firmware</text>

  <!-- QemuBridge box -->
  <rect x="300" y="105" width="140" height="70" rx="8" ry="8"
        class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="370" y="145" text-anchor="middle" class="label-bold">QemuBridge</text>

  <!-- CocotemuAxiMaster box -->
  <rect x="500" y="105" width="175" height="70" rx="8" ry="8"
        class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="587" y="135" text-anchor="middle" class="label-bold" font-size="12">CocotemuAxiMaster</text>
  <text x="587" y="155" text-anchor="middle" class="label-sub">(cocotbext-axi)</text>

  <!-- Verilator / DUT box -->
  <rect x="790" y="105" width="160" height="70" rx="8" ry="8"
        class="box" fill="#fff2cc" stroke="#d6b656"/>
  <text x="870" y="137" text-anchor="middle" class="label-bold">Verilator</text>
  <text x="870" y="155" text-anchor="middle" class="label-sub">PL RTL / DUT</text>

  <!-- Forward arrows (solid) -->
  <!-- QEMU -> QemuBridge -->
  <line x1="165" y1="128" x2="298" y2="128" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="231" y="118" text-anchor="middle" class="edge-label">chardev Unix socket</text>
  <text x="231" y="106" text-anchor="middle" class="edge-label" font-style="italic">mmio_stub_msg_hdr (18 B)</text>

  <!-- QemuBridge -> CocotemuAxiMaster -->
  <line x1="440" y1="140" x2="498" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- CocotemuAxiMaster -> DUT -->
  <line x1="675" y1="128" x2="788" y2="128" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="731" y="118" text-anchor="middle" class="edge-label" font-size="11">AXI4-Lite</text>

  <!-- Return arrows (dashed) -->
  <!-- DUT -> CocotemuAxiMaster (response) -->
  <line x1="788" y1="158" x2="677" y2="158" stroke="#888" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ah-dash)"/>
  <text x="731" y="175" text-anchor="middle" class="edge-label" fill="#888">response</text>

  <!-- QemuBridge -> QEMU (response over socket) -->
  <line x1="298" y1="158" x2="167" y2="158" stroke="#888" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#ah-dash)"/>
  <text x="231" y="175" text-anchor="middle" class="edge-label" fill="#888">response</text>
</svg>